# Veröffentlicht die statische Web-Version auf GitHub Pages.
# Einmalig aktivieren: Repository → Settings → Pages → Source: "GitHub Actions".
# In der statischen Version werden Lernstände im Browser gespeichert; der KI-Tutor ist dort deaktiviert.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          VITE_STATIC: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
