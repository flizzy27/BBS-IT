# Baut die statische Web-Version und veröffentlicht sie im Branch "gh-pages" (GitHub Pages, kostenlos).
# Adresse: https://<benutzer>.github.io/<repository>/
# In der Web-Version werden Lernstände im Browser gespeichert; der KI-Tutor ist dort deaktiviert
# (stattdessen: "KI-Prompt kopieren" an jeder Aufgabe).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Statische Version bauen
        run: npx vite build --base=./
        env:
          VITE_STATIC: '1'
      - name: Nach gh-pages veröffentlichen
        run: |
          cd dist
          touch .nojekyll
          cp index.html 404.html
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Web-Version ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
